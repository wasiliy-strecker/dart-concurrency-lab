name: dart_concurrency_lab
description: Executable Dart concurrency experiments with deterministic tests, benchmarks, and a production-style streaming CLI.
version: 0.1.0
homepage: https://github.com/wasiliy-strecker/dart-concurrency-lab
repository: https://github.com/wasiliy-strecker/dart-concurrency-lab
issue_tracker: https://github.com/wasiliy-strecker/dart-concurrency-lab/issues
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'

executables:
  ndjson_analyzer: ndjson_analyzer

topics:
  - async
  - cli
  - concurrency
  - isolates
  - streams

dependencies:
  args: ^2.7.0

dev_dependencies:
  coverage: ^1.16.0
  lints: ^6.1.0
  test: ^1.31.2
